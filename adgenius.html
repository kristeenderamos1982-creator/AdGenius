<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdGenius AI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      }
      /* Simple loading spinner */
      .loader {
        border: 4px solid #f3f3f3; /* Light grey */
        border-top: 4px solid #3498db; /* Blue */
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: auto;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.23.0"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen">
    <div id="root"></div>

    <script type="module">
        import { GoogleGenAI, Type } from '@google/genai';

        // --- Constants ---
        const PERSONA_OPTIONS = [ 'Overseas Filipino Worker (OFW)', '9-5 Employee', 'Stay-at-Home Parent', 'Freelancer / Online Worker', 'Aspiring Affiliate', 'Content Creator', 'Student / Fresh Grad', 'Small Business Owner' ];
        const OFFER_TYPE_OPTIONS = [ 'BEST Passive AI Online Business', 'JC Premiere Franchise Business', 'JC Premiere Products', 'Video Presentation' ];
        const AWARENESS_OPTIONS = ['Product-Aware','Problem-Aware','Most-Aware','Cold'];
        const OBJECTIVE_OPTIONS = ['Leads','Conversions','Traffic','Engagement','Message'];
        const DRIVER_OPTIONS = ['Family','Freedom','Security','Pride','Time','Hope','Fear','Greed','Belonging','Convenience'];
        const TONE_OPTIONS = ['Default (AI Choice)','Professional','Friendly','Urgent','Inspirational','Humorous','Empathetic'];
        
        // --- App State ---
        let adPackage = null;
        let variantPackage = null;
        let status = 'idle'; // 'idle' | 'generating' | 'ready' | 'error' | 'creating variant'
        let activeTab = 'headlines'; // 'headlines' | 'copy' | 'creatives' | 'export'
        let ai = null; // Will be initialized when API key is provided
        const process = { env: {} }; // API_KEY will be populated from localStorage or input

        // --- DOM Element References ---
        // Will be populated by render functions
        const dom = {};

        // --- Gemini Service ---
        const adPackageSchema = {
            type: Type.OBJECT,
            properties: {
                headlines: { type: Type.ARRAY, description: "Generate 5 diverse, high-impact headlines.", items: { type: Type.OBJECT, properties: { text: { type: Type.STRING }, ctr: { type: Type.NUMBER }, tone: { type: Type.STRING } }, required: ['text', 'ctr', 'tone'] } },
                copy: { type: Type.OBJECT, description: "Generate ad copy in three different lengths.", properties: { short: { type: Type.STRING }, medium: { type: Type.OBJECT, properties: { text: { type: Type.STRING }, justification: { type: Type.STRING } }, required: ['text', 'justification'] }, long: { type: Type.OBJECT, properties: { text: { type: Type.STRING }, justification: { type: Type.STRING } }, required: ['text', 'justification'] } }, required: ['short', 'medium', 'long'] },
                creatives: { type: Type.ARRAY, description: "Suggest 2-3 creative ideas for visuals (images or videos).", items: { type: Type.OBJECT, properties: { type: { type: Type.STRING }, score: { type: Type.INTEGER }, desc: { type: Type.STRING } }, required: ['type', 'score', 'desc'] } },
            },
            required: ['headlines', 'copy', 'creatives'],
        };

        const generateAdPackage = async (context) => {
            if (!ai) {
                alert('API Key is not configured. Using mock data.');
                return createMockPackage(context);
            }
            const prompt = `Generate a complete, high-converting ad package based on the following details. The target audience is in the Philippines. Use culturally relevant language and examples where appropriate.\n\n- Target Persona: ${context.persona}\n- Offer Type: ${context.offerType}\n- Audience Awareness Level: ${context.awareness}\n- Main Promise: ${context.promise}\n- Price (Optional): ${context.price || 'Not specified'}\n- Key Emotional Drivers: ${context.drivers.join(', ')}\n- Desired Tone: ${context.tone}\n- Ad Objective: ${context.objective}\n\nYour response must be a JSON object that strictly follows the provided schema.`;

            try {
                const response = await ai.models.generateContent({ model: "gemini-2.5-flash", contents: prompt, config: { responseMimeType: "application/json", responseSchema: adPackageSchema, temperature: 0.8 } });
                const adPackageData = JSON.parse(response.text.trim());
                return { ...adPackageData, meta: context, generatedAt: new Date().toISOString() };
            } catch (error) {
                console.error("Error calling Gemini API:", error);
                throw new Error("Failed to generate ad package from Gemini API. Check your API key and network connection.");
            }
        };

        const createMockPackage = (context) => {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve({
                        headlines: [ { text: `Earn while abroad — ${context.persona || 'YOU'}`, ctr: 2.4, tone: 'Inspirational' }, { text: `Sali na: Passive income for ${context.persona || 'you'}`, ctr: 2.1, tone: 'Direct' }, { text: `No experience? No problem — ${context.offerType || 'this system'}`, ctr: 1.9, tone: 'Friendly' }, { text: `How ${context.persona || 'OFWs'} earn extra ₱10k/mo — simple steps`, ctr: 2.0, tone: 'Curious' }, { text: `Quick Setup: Start earning in 24 hours`, ctr: 1.8, tone: 'Urgent' } ],
                        copy: { short: `ssshhh... I got paid again — join ${context.offerType || 'the system'} and start reselling digital products.`, medium: { text: `Want extra income without quitting your job? ${context.offerType || ''} gives you done-for-you funnels, product vaults, and automated chatbots so you can sell with minimal work. Join now and start earning.`, justification: 'Uses convenience and freedom drivers to position the offer as a low-effort income stream.' }, long: { text: `Meet Maria, an OFW who started reselling digital products using ${context.offerType || ''}. With a ready-made funnel, sample ads, and a chatbot that follows up for 30 days, she started earning commissions within the first week.`, justification: 'Story-driven angle to build credibility and address fear of complexity.' } },
                        creatives: [ { type: 'UGC Video', score: 86, desc: 'Phone POV of checking GCash notification: "Cha-ching — GCash received" with short testimonial overlay.' }, { type: 'Single Image (Hero)', score: 72, desc: 'Person holding phone with earnings screenshot and short headline overlay.' } ],
                        meta: context,
                        generatedAt: new Date().toISOString()
                    });
                }, 800);
            });
        };

        // --- Helper Functions ---
        const downloadFile = (content, filename, mime = 'application/json') => {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        };
        
        const generateSummaryString = (pkg, title) => {
            if (!pkg) return 'No package data available.';
            const h = (pkg.headlines || []).map((h, i) => `${i + 1}. ${h.text} (CTR: ${h.ctr}%, Tone: ${h.tone})`).join('\n');
            const c = (pkg.creatives || []).map((c, i) => `${i + 1}. [${c.type}] - ${c.desc} (Score: ${c.score})`).join('\n');
            return `=================================\n${title}\n=================================\n- Target Persona: ${pkg.meta?.persona || 'N/A'}\n- Offer Type: ${pkg.meta?.offerType || 'N/A'}\n- Audience Awareness: ${pkg.meta?.awareness || 'N/A'}\n- Main Promise: "${pkg.meta?.promise || 'N/A'}"\n- Price Point: ${pkg.meta?.price || 'N/A'}\n- Emotional Drivers: ${(pkg.meta?.drivers || []).join(', ') || 'N/A'}\n- Tone: ${pkg.meta?.tone || 'N/A'}\n- Ad Objective: ${pkg.meta?.objective || 'N/A'}\n\nHEADLINES:\n${h}\n\nAD COPY SHORT:\n${pkg.copy?.short || 'N/A'}\n\nAD COPY MEDIUM:\n${pkg.copy?.medium?.text || 'N/A'}\nStrategy: ${pkg.copy?.medium?.justification || 'N/A'}\n\nAD COPY LONG:\n${pkg.copy?.long?.text || 'N/A'}\nStrategy: ${pkg.copy?.long?.justification || 'N/A'}\n\nCREATIVES:\n${c}`;
        };

        // --- Rendering Logic ---
        function updateOutputDisplay() {
            const statusColors = { ready: 'text-green-400', generating: 'text-yellow-400', error: 'text-red-400' };
            dom.statusText.textContent = status;
            dom.statusText.className = `font-semibold ${statusColors[status] || 'text-yellow-400'}`;

            dom.tabButtons.forEach(btn => {
                const isSelected = btn.dataset.tab === activeTab;
                btn.className = `px-4 py-2 text-sm font-semibold rounded-t-md transition-colors duration-200 ${isSelected ? 'bg-slate-800 text-sky-400 border-b-2 border-sky-400' : 'text-slate-400 hover:bg-slate-800/50'}`;
            });
            
            dom.createVariantBtn.disabled = !adPackage || status === 'generating';
            dom.downloadA.disabled = !adPackage;
            dom.downloadB.disabled = !variantPackage;

            renderOutputContent();
        }

        function renderOutputContent() {
            dom.outputContent.innerHTML = '';
            if (status === 'generating') {
                dom.outputContent.innerHTML = `<div class="text-center p-10 text-slate-400 flex flex-col items-center gap-4"> <div class="loader"></div> Generating your ad package...</div>`;
                return;
            }
            if (!adPackage) {
                dom.outputContent.innerHTML = `<div class="text-center p-10 text-slate-400">Your AI-generated content will appear here.</div>`;
                return;
            }

            const copyIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 4.625v2.625a2.625 2.625 0 01-2.625 2.625H6.75a2.625 2.625 0 01-2.625-2.625V12a2.625 2.625 0 012.625-2.625h3.875M15.75 8.625c.621 0 1.125.504 1.125 1.125v7.5c0 .621-.504 1.125-1.125 1.125h-7.5a1.125 1.125 0 01-1.125-1.125v-7.5c0-.621.504-1.125 1.125-1.125h7.5z"></path></svg>`;
            const attachCopyListener = (selector, text) => {
                const btn = dom.outputContent.querySelector(selector);
                if(btn) btn.onclick = () => navigator.clipboard.writeText(text);
            };

            switch(activeTab) {
                case 'headlines':
                    dom.outputContent.innerHTML = `<div class="space-y-4">${adPackage.headlines.map((h, idx) => `
                        <div class="bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                            <p class="text-lg font-semibold text-white">${h.text}</p>
                            <div class="flex items-center justify-between mt-2">
                                <p class="text-xs text-slate-400">Predicted CTR: <span class="font-bold text-sky-400">${h.ctr}%</span> • Tone: <span class="font-bold text-sky-400">${h.tone}</span></p>
                                <button data-copy-idx="${idx}" class="flex items-center gap-1 px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs">${copyIcon} Copy</button>
                            </div>
                        </div>`).join('')}</div>`;
                    adPackage.headlines.forEach((h, idx) => attachCopyListener(`[data-copy-idx="${idx}"]`, h.text));
                    break;
                case 'copy':
                    dom.outputContent.innerHTML = `<div class="space-y-4">
                        <div class="bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                            <div class="flex justify-between items-center mb-2"><h4 class="text-sm font-bold text-sky-400">Short (Reels/Stories)</h4><button id="copy-short" class="flex items-center gap-1 px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs">${copyIcon} Copy</button></div>
                            <p class="text-slate-200 whitespace-pre-wrap">${adPackage.copy.short}</p>
                        </div>
                        <div class="bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                             <div class="flex justify-between items-center mb-2"><h4 class="text-sm font-bold text-sky-400">Medium (Feed)</h4><button id="copy-medium" class="flex items-center gap-1 px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs">${copyIcon} Copy</button></div>
                            <p class="text-slate-200 mb-3">${adPackage.copy.medium.text}</p><p class="text-xs italic bg-slate-900/70 p-2 rounded text-slate-400"><strong>Strategy:</strong> ${adPackage.copy.medium.justification}</p>
                        </div>
                         <div class="bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                             <div class="flex justify-between items-center mb-2"><h4 class="text-sm font-bold text-sky-400">Long (Lead/Story)</h4><button id="copy-long" class="flex items-center gap-1 px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs">${copyIcon} Copy</button></div>
                            <p class="text-slate-200 mb-3 whitespace-pre-wrap">${adPackage.copy.long.text}</p><p class="text-xs italic bg-slate-900/70 p-2 rounded text-slate-400"><strong>Strategy:</strong> ${adPackage.copy.long.justification}</p>
                        </div></div>`;
                    attachCopyListener('#copy-short', adPackage.copy.short);
                    attachCopyListener('#copy-medium', adPackage.copy.medium.text);
                    attachCopyListener('#copy-long', adPackage.copy.long.text);
                    break;
                case 'creatives':
                    dom.outputContent.innerHTML = `<div class="space-y-4">${adPackage.creatives.map(c => `
                        <div class="bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                            <strong class="text-base font-bold text-sky-400">${c.type}</strong>
                            <p class="text-xs text-slate-400 mt-1">Predicted Engagement Score: <span class="font-bold text-white">${c.score}</span></p>
                            <p class="mt-2 text-slate-200">${c.desc}</p>
                        </div>`).join('')}</div>`;
                    break;
                case 'export':
                    const controlSummary = generateSummaryString(adPackage, 'Package A (Control)');
                    const variantSummary = generateSummaryString(variantPackage, 'Package B (Variant)');
                    dom.outputContent.innerHTML = `<div class="space-y-4">
                        <div class="bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                             <h3 class="text-md font-bold mb-2 text-white">Package A (Control) Summary</h3>
                             <div class="flex gap-2 mb-3">
                                 <button id="export-copy-A" class="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-semibold">Copy Summary</button>
                                 <button id="export-download-A" class="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-semibold">Download .txt</button>
                             </div>
                             <pre class="mt-3 p-3 bg-slate-900/50 rounded-md text-xs text-slate-300 whitespace-pre-wrap font-mono overflow-auto max-h-60">${controlSummary}</pre>
                        </div>
                         <div class="bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                             <h3 class="text-md font-bold mb-2 text-white">Package B (Variant) Summary</h3>
                             ${variantPackage ? `
                                 <div class="flex gap-2 mb-3">
                                     <button id="export-copy-B" class="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-semibold">Copy Summary</button>
                                     <button id="export-download-B" class="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-semibold">Download .txt</button>
                                 </div>
                                 <pre class="mt-3 p-3 bg-slate-900/50 rounded-md text-xs text-slate-300 whitespace-pre-wrap font-mono overflow-auto max-h-60">${variantSummary}</pre>
                             ` : `<p class="text-sm text-slate-500">No Variant Generated. Click "Create Split Test" below.</p>`}
                        </div></div>`;
                    attachCopyListener('#export-copy-A', controlSummary);
                    dom.outputContent.querySelector('#export-download-A')?.addEventListener('click', () => downloadFile(controlSummary, 'ad-summary-A.txt', 'text/plain'));
                    if(variantPackage) {
                        attachCopyListener('#export-copy-B', variantSummary);
                        dom.outputContent.querySelector('#export-download-B')?.addEventListener('click', () => downloadFile(variantSummary, 'ad-summary-B.txt', 'text/plain'));
                    }
                    break;
            }
        }

        // --- Event Handlers ---
        const handleGenerate = async (e) => {
            e.preventDefault();
            const generateBtn = dom.inputForm.querySelector('button[type="submit"]');
            generateBtn.disabled = true;
            generateBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Generating...`;

            setStatus('generating');
            adPackage = null;
            variantPackage = null;

            try {
                const context = {
                    persona: dom.inputForm.persona.value,
                    offerType: dom.inputForm.offerType.value || dom.inputForm.offerType.placeholder,
                    awareness: dom.inputForm.awareness.value,
                    promise: dom.inputForm.promise.value,
                    price: dom.inputForm.price.value,
                    drivers: Array.from(dom.driversContainer.querySelectorAll('button.bg-sky-500')).map(b => b.textContent),
                    tone: dom.inputForm.tone.value,
                    objective: dom.inputForm.objective.value,
                };
                const pkg = await generateAdPackage(context);
                adPackage = pkg;
                setStatus('ready');
            } catch (error) {
                console.error(error);
                setStatus('error');
                alert(error.message);
            } finally {
                generateBtn.disabled = !dom.inputForm.promise.value;
                generateBtn.textContent = 'Generate Ad Package';
            }
        };

        const handleCreateVariant = () => {
            if (!adPackage) return;
            setStatus('creating variant');
            const variant = JSON.parse(JSON.stringify(adPackage));
            variant.headlines = variant.headlines.map(h => ({ ...h, ctr: Math.max(0.8, parseFloat((h.ctr * 0.9).toFixed(1))), tone: h.tone === 'Inspirational' ? 'Urgent' : 'Friendly' }));
            variant.copy.short = variant.copy.short.replace('ssshhh...', 'Hey!');
            variant.generatedAt = new Date().toISOString();
            variantPackage = variant;
            setStatus('ready');
        };

        const handleSaveApiKey = () => {
            const key = dom.apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                initializeAiClient(key);
            } else {
                localStorage.removeItem('gemini_api_key');
                ai = null; // de-initialize
                process.env.API_KEY = undefined;
                updateApiKeyStatus(false, 'Key Removed');
            }
        };
        
        const initializeAiClient = (key) => {
            try {
                process.env.API_KEY = key;
                ai = new GoogleGenAI({ apiKey: process.env.API_KEY });
                updateApiKeyStatus(true, 'API Key Active');
            } catch(e) {
                console.error("Failed to initialize GoogleGenAI:", e);
                ai = null;
                process.env.API_KEY = undefined;
                updateApiKeyStatus(false, 'Initialization Failed');
            }
        };

        const updateApiKeyStatus = (isSuccess, message) => {
            dom.apiKeyStatus.textContent = message;
            if (isSuccess) {
                dom.apiKeyStatus.className = 'text-xs font-mono px-2 py-1 rounded bg-green-500/20 text-green-400';
            } else {
                dom.apiKeyStatus.className = 'text-xs font-mono px-2 py-1 rounded bg-yellow-500/20 text-yellow-400';
            }
        };

        const loadAndSetApiKey = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                dom.apiKeyInput.value = savedKey;
                initializeAiClient(savedKey);
            } else {
                updateApiKeyStatus(false, 'No Key Found');
            }
        };

        const setStatus = (newStatus) => {
            status = newStatus;
            updateOutputDisplay();
        };

        // --- Initial Application Setup ---
        function init() {
            const root = document.getElementById('root');
            root.innerHTML = `
            <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
              <header class="text-center mb-8">
                <h1 class="text-3xl sm:text-4xl font-bold text-white tracking-tight"><span class="text-sky-400">AdGenius</span> AI</h1>
                <p class="text-md text-slate-400 mt-2">AI-Powered Advertising Package Generator</p>
              </header>
              <main class="grid grid-cols-1 lg:grid-cols-[420px_1fr] gap-8">
                <div class="flex flex-col gap-8">
                    <section id="apiKeyCard" class="bg-slate-800/50 border border-slate-700 rounded-xl p-6 text-left shadow-lg">
                        <div class="flex items-center justify-between">
                            <label for="apiKeyInput" class="text-sm font-semibold text-white">Your Google Gemini API Key</label>
                            <span id="apiKeyStatus" class="text-xs font-mono px-2 py-1 rounded"></span>
                        </div>
                        <div class="flex gap-2 mt-2">
                            <input type="password" id="apiKeyInput" class="flex-grow p-2 rounded bg-slate-900 border border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none text-slate-200" placeholder="Enter your API key here...">
                            <button id="saveApiKeyBtn" class="px-4 py-2 rounded-md bg-sky-600 hover:bg-sky-500 text-white font-semibold transition-colors">Save Key</button>
                        </div>
                        <p class="text-xs text-slate-400 mt-2">
                            Get your free API key from <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" class="text-sky-400 underline hover:text-sky-300">Google AI Studio</a>. The key is stored only in your browser.
                        </p>
                    </section>
                    <section class="bg-slate-800/50 border border-slate-700 rounded-xl p-6 shadow-lg">
                        <h2 class="text-xl font-bold text-white">Ad Input</h2>
                        <p class="text-sm text-slate-400 mt-1">Fill the offer details then click <strong>Generate</strong>.</p>
                        <form id="inputForm" class="mt-6 space-y-4 text-slate-300">
                            <div><label class="block text-sm font-semibold mb-1">Target Persona</label><select name="persona" class="w-full p-2.5 rounded bg-slate-900 border border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">${PERSONA_OPTIONS.map(o => `<option value="${o}">${o}</option>`).join('')}</select></div>
                            <div><label class="block text-sm font-semibold mb-1">Offer Type</label><input name="offerType" class="w-full p-2.5 rounded bg-slate-900 border border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none" placeholder="${OFFER_TYPE_OPTIONS[0]}" /></div>
                            <div><label class="block text-sm font-semibold mb-1">Audience Awareness</label><select name="awareness" class="w-full p-2.5 rounded bg-slate-900 border border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">${AWARENESS_OPTIONS.map(o => `<option value="${o}" ${o === 'Problem-Aware' ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
                            <div><label class="block text-sm font-semibold mb-1">Main Promise (short)</label><input name="promise" class="w-full p-2.5 rounded bg-slate-900 border border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none" placeholder="e.g. Earn ₱2,000 per client setup" required /></div>
                            <div><label class="block text-sm font-semibold mb-1">Emotional Drivers (toggle)</label><div id="driversContainer" class="flex flex-wrap gap-2 mt-2">${DRIVER_OPTIONS.map(d => `<button type="button" class="px-3 py-1.5 rounded-full text-sm font-medium transition-all duration-200 bg-slate-700/50 hover:bg-slate-700 border border-slate-600">${d}</button>`).join('')}</div></div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label class="block text-sm font-semibold mb-1">Tone</label><select name="tone" class="w-full p-2.5 rounded bg-slate-900 border border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">${TONE_OPTIONS.map(o => `<option value="${o}">${o}</option>`).join('')}</select></div>
                                <div><label class="block text-sm font-semibold mb-1">Price (optional)</label><input name="price" class="w-full p-2.5 rounded bg-slate-900 border border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none" placeholder="₱19,386" /></div>
                            </div>
                            <div><label class="block text-sm font-semibold mb-1">Ad Objective</label><select name="objective" class="w-full p-2.5 rounded bg-slate-900 border border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">${OBJECTIVE_OPTIONS.map((o,i) => `<option value="${o}" ${i===1 ? 'selected':''}>${o}</option>`).join('')}</select></div>
                            <div class="pt-4"><button type="submit" disabled class="w-full py-3 rounded-lg bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold text-base shadow-lg hover:shadow-cyan-500/50 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none">Generate Ad Package</button></div>
                        </form>
                    </section>
                </div>
                <section id="outputDisplay" class="bg-slate-900/70 p-6 rounded-xl shadow-lg border border-slate-700">
                  <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-bold text-white">AI Output</h2>
                    <div class="text-sm text-slate-400 capitalize">Status: <span id="statusText"></span></div>
                  </div>
                  <div id="tabContainer" class="flex gap-2 mb-4 border-b border-slate-700">
                    <button data-tab="headlines">Headlines</button>
                    <button data-tab="copy">Ad Copy</button>
                    <button data-tab="creatives">Creatives</button>
                    <button data-tab="export">Export</button>
                  </div>
                  <div id="outputContent" class="min-h-[400px]"></div>
                  <div class="mt-6 border-t border-slate-700 pt-4 text-sm">
                    <div class="flex flex-wrap gap-3">
                        <button id="createVariantBtn" class="px-4 py-2 rounded-md bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-semibold shadow-md hover:shadow-cyan-500/40 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none transition-all">Create Split Test</button>
                        <button id="downloadA" class="px-4 py-2 rounded-md bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Download JSON (A)</button>
                        <button id="downloadB" class="px-4 py-2 rounded-md bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Download JSON (B)</button>
                    </div>
                    <p class="text-xs text-slate-500 mt-3">Use the Export tab to copy or download text summaries.</p>
                  </div>
                </section>
              </main>
              <footer class="text-center mt-12 text-sm text-sky-400/60">Powered by Google Gemini. Built for performance and creativity.</footer>
            </div>`;

            // Assign DOM elements
            dom.inputForm = document.getElementById('inputForm');
            dom.driversContainer = document.getElementById('driversContainer');
            dom.statusText = document.getElementById('statusText');
            dom.tabContainer = document.getElementById('tabContainer');
            dom.tabButtons = Array.from(dom.tabContainer.querySelectorAll('button'));
            dom.outputContent = document.getElementById('outputContent');
            dom.createVariantBtn = document.getElementById('createVariantBtn');
            dom.downloadA = document.getElementById('downloadA');
            dom.downloadB = document.getElementById('downloadB');
            dom.apiKeyInput = document.getElementById('apiKeyInput');
            dom.saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
            dom.apiKeyStatus = document.getElementById('apiKeyStatus');
            
            // Wire up event listeners
            dom.inputForm.addEventListener('submit', handleGenerate);
            dom.inputForm.promise.addEventListener('input', (e) => {
                dom.inputForm.querySelector('button[type="submit"]').disabled = !e.target.value;
            });
            
            dom.saveApiKeyBtn.addEventListener('click', handleSaveApiKey);

            dom.driversContainer.addEventListener('click', (e) => {
                if(e.target.tagName === 'BUTTON') {
                    e.target.classList.toggle('bg-sky-500');
                    e.target.classList.toggle('text-white');
                    e.target.classList.toggle('border-sky-500');
                    e.target.classList.toggle('bg-slate-700/50');
                    e.target.classList.toggle('border-slate-600');
                }
            });

            dom.tabButtons.forEach(btn => btn.addEventListener('click', () => {
                activeTab = btn.dataset.tab;
                updateOutputDisplay();
            }));

            dom.createVariantBtn.addEventListener('click', handleCreateVariant);
            dom.downloadA.addEventListener('click', () => downloadFile(JSON.stringify(adPackage, null, 2), 'ad-package-A.json'));
            dom.downloadB.addEventListener('click', () => downloadFile(JSON.stringify(variantPackage, null, 2), 'ad-package-B.json'));
            
            loadAndSetApiKey();

            // Initial render
            setStatus('idle');
        }

        // Run the app
        init();
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
